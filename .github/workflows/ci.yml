name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Build
        run: swift build

      # scripts/test.sh uses plain `swift test` when a full Xcode is present
      # (as on the runners); CLT workarounds only kick in locally.
      - name: Test
        run: ./scripts/test.sh

      - name: Release build + app bundle
        run: ./scripts/make-app.sh
